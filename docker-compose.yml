services:
  postgres:
    image: postgres:16-alpine
    container_name: storepay-postgres
    environment:
      POSTGRES_DB: storepay
      POSTGRES_USER: storepay
      POSTGRES_PASSWORD: storepay
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U storepay -d storepay"]
      interval: 5s
      timeout: 3s
      retries: 10

  # 결제사 역할. storepay 가 실제 HTTP 로 외부와 주고받는 경로를 끝까지 돌려보기 위한 것.
  mock-pg:
    build:
      context: .
      dockerfile: storepay-mock-pg/Dockerfile
    container_name: storepay-mock-pg
    environment:
      PG_API_KEY: local-test-key
      PG_WEBHOOK_SECRET: local-test-secret
      PG_WEBHOOK_URL: http://api:8080/api/v1/webhooks/pg
    ports:
      - "8090:8090"

  api:
    build:
      context: .
      dockerfile: storepay-api/Dockerfile
    container_name: storepay-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # pg-http 프로필에서는 시뮬레이션 대신 mock-pg 와 실제로 통신한다.
      SPRING_PROFILES_ACTIVE: pg-http
      DB_URL: jdbc:postgresql://postgres:5432/storepay
      DB_USERNAME: storepay
      DB_PASSWORD: storepay
      PG_BASE_URL: http://mock-pg:8090
      PG_API_KEY: local-test-key
      PG_WEBHOOK_SECRET: local-test-secret
    ports:
      - "8080:8080"

volumes:
  postgres-data:
