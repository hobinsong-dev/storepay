server:
  port: ${SERVER_PORT:8090}

spring:
  application:
    name: storepay-mock-pg

mock-pg:
  api-key: ${PG_API_KEY:local-test-key}
  webhook-secret: ${PG_WEBHOOK_SECRET:local-test-secret}
  webhook-url: ${PG_WEBHOOK_URL:http://localhost:8080/api/v1/webhooks/pg}
  # 0 이면 지연 없음. 타임아웃 동작을 보려면 늘린다.
  approve-latency: ${PG_APPROVE_LATENCY:0ms}
  # 수신 측이 2xx 를 줄 때까지 물러나며 다시 보낸다. 승인 트랜잭션이 커밋되기 전에
  # 도착한 웹훅은 409 로 거절되는데, 재전송이 없으면 그 결제는 영영 복구되지 않는다.
  webhook-max-attempts: ${PG_WEBHOOK_MAX_ATTEMPTS:5}
  webhook-retry-delay: ${PG_WEBHOOK_RETRY_DELAY:200ms}

logging:
  level:
    dev.hobin.mockpg: DEBUG
