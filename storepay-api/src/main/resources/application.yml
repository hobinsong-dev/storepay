spring:
  application:
    name: storepay-api

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/storepay}
    username: ${DB_USERNAME:storepay}
    password: ${DB_PASSWORD:storepay}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      connection-timeout: 3000

  jpa:
    open-in-view: false
    hibernate:
      # 스키마는 Flyway만 바꾼다. 애플리케이션은 스키마가 맞는지 검증만 하고,
      # 어긋나면 기동 단계에서 죽는 편이 운영 중에 조용히 틀리는 것보다 낫다.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc.batch_size: 50
        order_inserts: true
        order_updates: true
        default_batch_fetch_size: 100

  flyway:
    enabled: true
    baseline-on-migrate: true

  jackson:
    default-property-inclusion: non_null

storepay:
  pg:
    base-url: ${PG_BASE_URL:http://localhost:8090}
    api-key: ${PG_API_KEY:local-test-key}
    webhook-secret: ${PG_WEBHOOK_SECRET:local-test-secret}
    connect-timeout: 2s
    read-timeout: 10s
    max-attempts: 2
    webhook-tolerance: 5m

  settlement:
    # 영업일 경계를 자르는 타임존. 서버 기본값(컨테이너는 보통 UTC)을 쓰면
    # 경계가 9시간 밀려 하루치 정산이 통째로 어긋난다.
    zone: Asia/Seoul
    default-fee-rate: 0.023
    fee-rates:
      CARD: 0.023
      EASY_PAY: 0.028
      BANK_TRANSFER: 0.010
    # 전날 영업일을 새벽에 대사한다. 결제사 내역이 올라오기 전에 돌리면
    # 전 건이 MISSING_IN_PG 로 잡히므로 충분히 늦춘다.
    schedule:
      enabled: ${SETTLEMENT_SCHEDULE_ENABLED:false}
      cron: "0 30 4 * * *"

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus
  endpoint:
    health:
      show-details: when-authorized

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha

logging:
  level:
    dev.hobin.storepay: DEBUG
  # 추적 키를 패턴에 박아 둔다. 코드에서 매번 파라미터로 붙이면 빠뜨린 줄이 생기고,
  # 하필 그 줄이 장애 때 필요한 줄이 된다. 값이 없으면 '-' 로 자리를 유지한다.
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %5p [%X{requestId:--} %X{paymentKey:--}] [%t] %-40.40logger{39} : %m%n%wEx"
  # 운영에서는 ECS JSON 한 줄로 내보낸다(LOG_FORMAT=ecs). 사람이 읽는 형식 그대로 수집기에
  # 넣으면 requestId 로 검색할 수 없어 추적 키를 붙여 둔 의미가 사라진다.
  # 이 값이 설정되면 위 pattern 은 무시된다. MDC 는 ECS 포맷에 자동으로 포함된다.
  structured:
    format:
      console: ${LOG_FORMAT:}
